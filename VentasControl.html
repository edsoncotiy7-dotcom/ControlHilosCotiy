<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HILOS COTIY</title>
<style>
:root{--pink:#f6d5dc;--pink2:#fbeaee;--bg:#fff;--g:#f3f3f4;--g2:#e2e2e5;--ink:#111;--mut:#6b6b73;--ok:#1f7a4d;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--pink:#4a2a33;--pink2:#2d1c21;--bg:#161618;--g:#222225;--g2:#38383d;--ink:#f4f4f5;--mut:#a0a0a8;--ok:#5fd199;--err:#ff8a80}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.s{background:var(--g);color:var(--ink);border:1px solid var(--g2)}
.btn.d{background:var(--err);color:#fff}.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select{width:100%;padding:10px 12px;border:1px solid var(--g2);border-radius:10px;background:var(--bg)}
input:focus,select:focus,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.login .l{background:var(--pink);padding:48px;display:flex;flex-direction:column;justify-content:center;color:#111}
.login .l h1{font-size:clamp(34px,5vw,60px);letter-spacing:2px}.login .l h2{margin-top:12px;letter-spacing:4px}
.login .r{display:flex;align-items:center;justify-content:center;padding:32px}.login form{width:100%;max-width:340px}
.login .r .btn{width:100%;margin-top:20px;letter-spacing:2px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--g);border-right:1px solid var(--g2);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav .logo{font-weight:800;letter-spacing:2px;padding:6px 10px 16px}
nav a{display:block;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink)}
nav a.on{background:var(--pink)}nav .sp{flex:1}
nav .me{font-size:13px;color:var(--mut);padding:8px 10px}
main{padding:24px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--g);border:1px solid var(--g2);border-radius:14px;padding:16px}
.card small{color:var(--mut)}.card b{display:block;font-size:24px;margin-top:4px}.card.p{background:var(--pink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tw{overflow-x:auto;border:1px solid var(--g2);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--g2);white-space:nowrap}
th{background:var(--g);font-size:13px;color:var(--mut)}tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}.empty{color:var(--mut);padding:18px;text-align:center}
.pill{padding:2px 8px;border-radius:99px;background:var(--g);font-size:12px}.pill.ok{background:var(--pink)}.low{color:var(--err);font-weight:600}
.pos{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.res{border:1px solid var(--g2);border-radius:10px;margin-top:6px;max-height:240px;overflow:auto}
.res div{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid var(--g2)}.res div:hover{background:var(--pink2)}
.qty{display:inline-flex;align-items:center;gap:6px}.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--g2);background:var(--g);cursor:pointer}
.tot{font-size:28px;font-weight:700;display:flex;justify-content:space-between;margin:14px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}.box{background:var(--bg);border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--ink);font-size:14px}.chk input{width:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px}
#toast div{padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.25)}#toast .e{background:var(--err);color:#fff}
.tk{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#111;background:#fff;padding:14px;border:1px dashed #999;max-width:300px;margin:0 auto}
.tk h3{text-align:center}.tk .c{text-align:center}.tk hr{border:0;border-top:1px dashed #999}.tk .f{display:flex;justify-content:space-between;gap:8px}
.mb{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.pc2{background:var(--g);border:1px solid var(--g2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px}
.im{height:80px;border-radius:10px;background:var(--pink);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.pc2 .btn{margin-top:auto}
@media(max-width:820px){
.login{grid-template-columns:1fr}.login .l{padding:32px 24px;min-height:34vh}
.shell{grid-template-columns:1fr}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;border-right:0;border-top:1px solid var(--g2)}
nav .logo,nav .sp,nav .me{display:none}nav a{white-space:nowrap;padding:8px 10px;font-size:13px}nav .mb{display:block}
main{padding:16px 14px 90px}.pos{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none;display:block;padding:0}.box{box-shadow:none;padding:0;max-width:none}.noprint{display:none!important}.tk{border:0;max-width:none}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Q=n=>'Q'+Number(n||0).toFixed(2);
const SECS=[['dashboard','Dashboard'],['productos','Productos'],['ventas','Vender'],['historial','Historial'],['administracion','Administración'],['configuracion','Configuración']];
const LOW=5;
/* ---- Capa de datos: ÚNICO punto a reemplazar por la base de datos central (Supabase/Firebase) ----
   Ahora usa el almacenamiento del navegador solo como adaptador temporal. */
let mem={};
const Data={
 get(k,d){if(k in mem)return mem[k];try{const v=localStorage.getItem('hc_'+k);if(v)return JSON.parse(v)}catch(e){}return d},
 set(k,v){mem[k]=v;try{localStorage.setItem('hc_'+k,JSON.stringify(v))}catch(e){}},
 onChange(cb){addEventListener('storage',()=>{mem={};cb()})} /* sustituir por suscripción en tiempo real */
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
if(!Data.get('users')) Data.set('users',[{id:uid(),user:'Edson',pass:'4545',role:'Administrador',active:true,perms:SECS.map(s=>s[0])}]);
const users=()=>Data.get('users',[]),prods=()=>Data.get('products',[]),sales=()=>Data.get('sales',[]);
const cfg=()=>Data.get('settings',{name:'',phone:'',addr:'',msg:''});
const cur=()=>users().find(u=>u.id===Data.get('session')&&u.active);
const can=(u,p)=>u.role==='Administrador'||u.perms.includes(p);
let route='dashboard',cart=[],q='';
/* ---- UI helpers ---- */
function toast(m,err){const d=document.createElement('div');d.textContent=m;if(err)d.className='e';$('#toast').append(d);setTimeout(()=>d.remove(),3200)}
function modal(h){$('#modal').innerHTML='<div class="box">'+h+'</div>';$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on');$('#modal').innerHTML=''}
function confirmBox(msg,cb){modal(`<h3>Confirmar</h3><p>${esc(msg)}</p><div class="acts"><button class="btn s" onclick="closeM()">Cancelar</button><button class="btn d" id="cy">Confirmar</button></div>`);$('#cy').onclick=()=>{closeM();cb()}}
const empty=t=>`<div class="empty">${t}</div>`;
/* ---- Login ---- */
function loginView(){
 $('#app').innerHTML=`<div class="login"><div class="l"><h2 style="font-size:20px;letter-spacing:6px">BIENVENIDO</h2><h1>HILOS COTIY</h1><p style="margin-top:12px;font-size:17px">Sistema de ventas e inventario</p></div>
 <div class="r"><form id="lf"><h2 style="font-size:24px;letter-spacing:2px">INICIAR SESIÓN</h2>
 <label for="lu">Usuario</label><input id="lu" autocomplete="username" required>
 <label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password" required>
 <button class="btn" type="submit">ENTRAR</button></form></div></div>`;
 $('#lf').onsubmit=e=>{e.preventDefault();
  const u=users().find(x=>x.user.toLowerCase()===$('#lu').value.trim().toLowerCase()&&x.pass===$('#lp').value);
  if(!u)return toast('Usuario o contraseña incorrectos',1);
  if(!u.active)return toast('Usuario desactivado. Contacta al administrador',1);
  Data.set('session',u.id);route=SECS.find(s=>can(u,s[0]))?.[0]||'dashboard';render()}}
function logout(){Data.set('session',null);cart=[];render()}
/* ---- Shell ---- */
function render(){
 const u=cur();if(!u)return loginView();
 if(!can(u,route))route=SECS.find(s=>can(u,s[0]))?.[0];
 const c=cfg();
 $('#app').innerHTML=`<div class="shell"><nav><div class="logo">${esc(c.name||'HILOS COTIY')}</div>
 ${SECS.filter(s=>can(u,s[0])).map(s=>`<a class="${route===s[0]?'on':''}" onclick="go('${s[0]}')">${s[1]}</a>`).join('')}
 <div class="sp"></div><div class="me">${esc(u.user)} · ${esc(u.role)}</div><a onclick="logout()">Cerrar sesión</a><a class="mb" onclick="logout()">Salir</a></nav><main id="v"></main></div>`;
 ({dashboard,productos,ventas,historial,administracion,configuracion})[route]();
}
function go(r){route=r;render()}
/* ---- Dashboard ---- */
function dashboard(){
 const S=sales(),P=prods(),now=new Date(),sd=d=>new Date(d),
 day=S.filter(s=>sd(s.date).toDateString()===now.toDateString()),
 mon=S.filter(s=>sd(s.date).getMonth()===now.getMonth()&&sd(s.date).getFullYear()===now.getFullYear()),
 sum=a=>a.reduce((t,s)=>t+s.total,0),low=P.filter(p=>p.stock<=LOW),
 tp={};S.forEach(s=>s.items.forEach(i=>tp[i.name]=(tp[i.name]||0)+i.qty));
 const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5);
 $('#v').innerHTML=`<div class="top"><h2>Dashboard</h2></div><div class="cards">
 <div class="card p"><small>Ventas del día</small><b>${Q(sum(day))}</b></div>
 <div class="card"><small>Ventas del mes</small><b>${Q(sum(mon))}</b></div>
 <div class="card"><small>Total de ingresos</small><b>${Q(sum(S))}</b></div>
 <div class="card"><small>Productos registrados</small><b>${P.length}</b></div>
 <div class="card"><small>Poco inventario (≤${LOW})</small><b class="${low.length?'low':''}">${low.length}</b></div></div>
 <div class="cols"><div><h3 style="margin-bottom:8px">Últimas ventas</h3><div class="tw">${S.length?`<table><tr><th>Ticket</th><th>Fecha</th><th class="r">Total</th></tr>${S.slice(-5).reverse().map(s=>`<tr><td>${s.n}</td><td>${new Date(s.date).toLocaleString()}</td><td class="r">${Q(s.total)}</td></tr>`).join('')}</table>`:empty('Aún no hay ventas')}</div></div>
 <div><h3 style="margin-bottom:8px">Productos más vendidos</h3><div class="tw">${top.length?`<table><tr><th>Producto</th><th class="r">Unidades</th></tr>${top.map(t=>`<tr><td>${esc(t[0])}</td><td class="r">${t[1]}</td></tr>`).join('')}</table>`:empty('Sin datos de ventas')}</div></div>
 <div><h3 style="margin-bottom:8px">Resumen general</h3><div class="card">${S.length} ventas registradas · ${day.length} hoy · ${P.length} productos${low.length?`<br><span class="low">Reponer: ${low.map(p=>esc(p.name)).join(', ')}</span>`:''}</div></div></div>`}
/* ---- Productos ---- */
function productos(){
 const t=q.toLowerCase(),L=prods().filter(p=>(p.name+p.cat).toLowerCase().includes(t));
 $('#v').innerHTML=`<div class="top"><h2>Productos</h2><button class="btn" onclick="pform()">+ Nuevo producto</button></div>
 <input id="sq" placeholder="Buscar por nombre o categoría" value="${esc(q)}" style="margin-bottom:12px">
 <div class="tw">${L.length?`<table><tr><th>Nombre</th><th>Categoría</th><th class="r">Venta</th><th class="r">Existencias</th><th></th></tr>
 ${L.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td class="r">${Q(p.price)}</td><td class="r ${p.stock<=LOW?'low':''}">${p.stock}</td>
 <td class="r"><button class="btn s sm" onclick="pform('${p.id}')">Editar</button> <button class="btn d sm" onclick="pdel('${p.id}')">Eliminar</button></td></tr>`).join('')}</table>`:empty(prods().length?'Sin resultados':'No hay productos registrados. Crea el primero.')}</div>`;
 const i=$('#sq');i.oninput=()=>{q=i.value;const p=i.selectionStart;productos();const n=$('#sq');n.focus();n.setSelectionRange(p,p)}}
function pform(id){
 const p=prods().find(x=>x.id===id)||{code:'',name:'',cat:'',cost:'',price:'',stock:''};
 modal(`<h3>${id?'Editar':'Nuevo'} producto</h3><form id="pf">
 <label>Nombre *</label><input id="f2" value="${esc(p.name)}" required>
 <label>Categoría</label><input id="f3" value="${esc(p.cat)}">
 <label>Precio de venta *</label><input id="f5" type="number" min="0" step="0.01" value="${p.price}" required>
 <label>Existencias *</label><input id="f6" type="number" min="0" step="1" value="${p.stock}" required>
 <div class="acts"><button type="button" class="btn s" onclick="closeM()">Cancelar</button><button class="btn" type="submit">Guardar</button></div></form>`);
 $('#pf').onsubmit=e=>{e.preventDefault();
  const o={id:id||uid(),name:$('#f2').value.trim(),cat:$('#f3').value.trim(),price:+$('#f5').value,stock:parseInt($('#f6').value)};
  Data.set('products',id?prods().map(x=>x.id===id?o:x):[...prods(),o]);closeM();toast('Producto guardado');productos()}}
function pdel(id){confirmBox('¿Eliminar este producto?',()=>{Data.set('products',prods().filter(p=>p.id!==id));toast('Producto eliminado');productos()})}
/* ---- Ventas (POS) ---- */
function ventas(){
 $('#v').innerHTML=`<div class="top"><h2>Vender</h2></div><div class="pos"><div>
 <input id="bq" placeholder="Buscar producto" autocomplete="off"><div id="gr" class="grid"></div></div>
 <div class="card"><div id="ct"></div><div class="tot"><span>Total</span><span id="tt"></span></div>
 <label>Método de pago</label><select id="pm" onchange="cashV()"><option>Efectivo</option><option>Fiado</option><option>Tarjeta</option><option>Transferencia</option></select>
 <div id="cash"><label>¿Con cuánto paga el cliente?</label><input id="rec" type="number" min="0" step="0.01" inputmode="decimal" oninput="cashV()"><div id="chg" style="margin-top:8px;font-weight:600"></div></div>
 <div class="acts"><button class="btn s" onclick="cart=[];cartV()">Vaciar</button><button class="btn" id="fin" onclick="finish()">Finalizar venta</button></div></div></div>`;
 $('#bq').oninput=gridV;gridV();
 cartV()}
function gridV(){const t=($('#bq').value||'').toLowerCase().trim(),L=prods().filter(p=>p.name.toLowerCase().includes(t));
 $('#gr').innerHTML=L.length?L.map(p=>`<div class="pc2"><div class="im">${p.img?`<img src="${esc(p.img)}" alt="">`:esc((p.name||'?').charAt(0).toUpperCase())}</div><b>${esc(p.name)}</b><div>${Q(p.price)}</div><small class="${p.stock<=LOW?'low':''}">${p.stock>0?'Existencias: '+p.stock:'Agotado'}</small><button class="btn sm" onclick="addC('${p.id}')" ${p.stock<1?'disabled':''}>Agregar</button></div>`).join(''):`<div class="empty" style="grid-column:1/-1">${prods().length?'Sin resultados':'No hay productos registrados'}</div>`}
function addC(id){const p=prods().find(x=>x.id===id),l=cart.find(c=>c.id===id);
 if(!p||p.stock<1)return toast('Sin existencias',1);
 if(l){if(l.qty>=p.stock)return toast('No hay más existencias',1);l.qty++}else cart.push({id,name:p.name,price:p.price,qty:1});
 cartV()}
function qty(id,d){const l=cart.find(c=>c.id===id),p=prods().find(x=>x.id===id);const n=l.qty+d;
 if(n<1)cart=cart.filter(c=>c.id!==id);else if(n>p.stock)return toast('No hay más existencias',1);else l.qty=n;cartV()}
function rm(id){cart=cart.filter(c=>c.id!==id);cartV()}
const total=()=>cart.reduce((t,c)=>t+c.price*c.qty,0);
function cartV(){$('#ct').innerHTML=cart.length?`<div class="tw"><table style="min-width:0"><tr><th>Producto</th><th>Cant.</th><th class="r">Subtotal</th></tr>${cart.map(c=>`<tr><td>${esc(c.name)}<br><small>${Q(c.price)}</small></td>
 <td><span class="qty"><button onclick="qty('${c.id}',-1)">−</button>${c.qty}<button onclick="qty('${c.id}',1)">+</button></span></td><td class="r">${Q(c.price*c.qty)} <button class="btn d sm" onclick="rm('${c.id}')" aria-label="Quitar">✕</button></td></tr>`).join('')}</table></div>`:empty('Agrega productos a la venta');
 $('#tt').textContent=Q(total());cashV()}
function cashV(){const pm=$('#pm').value,t=total(),r=parseFloat($('#rec').value),c=$('#chg'),ef=pm==='Efectivo';
 $('#cash').style.display=ef?'block':'none';
 c.innerHTML=!ef||isNaN(r)?'':r<t?`<span class="low">Faltan ${Q(t-r)}</span>`:r>t?`Vuelto: ${Q(r-t)}`:'Sin vuelto (pago exacto)';
 $('#fin').disabled=!cart.length||(ef&&!(r>=t))}
function finish(){if(!cart.length)return;const pm=$('#pm').value;
 confirmBox(`¿Finalizar venta por ${Q(total())} (${pm})?`,()=>{
  const S=sales(),P=prods(),tn=Math.max(Data.get('ticketN',0),...S.map(x=>+x.n||0))+1,s={id:uid(),n:String(tn).padStart(6,'0'),date:new Date().toISOString(),items:cart.map(c=>({...c})),total:total(),pay:pm,paid:pm!=='Fiado',status:pm==='Fiado'?'Pendiente':'Pagada',recv:pm==='Efectivo'?parseFloat($('#rec').value):null,user:cur().user};
  Data.set('products',P.map(p=>{const c=cart.find(x=>x.id===p.id);return c?{...p,stock:p.stock-c.qty}:p}));
  Data.set('ticketN',tn);Data.set('sales',[...S,s]);cart=[];toast('Venta registrada');ticket(s,true)})}
/* ---- Ticket ---- */
function ticket(s,after){const c=cfg();
 modal(`<div id="tkb" class="tk"><h3>${esc(c.name||'HILOS COTIY')}</h3><div class="c">${esc(c.phone)}<br>${esc(c.addr)}</div><hr>
 <div>Ticket: ${s.n}<br>${new Date(s.date).toLocaleString()}</div><hr>
 ${s.items.map(i=>`<div>${esc(i.name)}</div><div class="f"><span>${i.qty} x ${Q(i.price)}</span><span>${Q(i.qty*i.price)}</span></div>`).join('')}<hr>
 <div class="f"><b>TOTAL</b><b>${Q(s.total)}</b></div><div>Pago: ${esc(s.pay)}${s.paid===false?' (PENDIENTE DE PAGO)':''}</div>${s.recv!=null?`<div class="f"><span>Recibido</span><span>${Q(s.recv)}</span></div><div class="f"><span>Vuelto</span><span>${Q(s.recv-s.total)}</span></div>`:''}<hr><div class="c">${esc(c.msg||'¡Gracias por su compra!')}</div></div>
 <div class="acts noprint"><button class="btn s" onclick="closeM();${after?"ventas()":"historial()"}">Cerrar</button><button class="btn" onclick="print()">Imprimir / Guardar PDF</button></div>`);
 if(after)ventas()}
/* ---- Historial ---- */
function historial(){const S=sales().slice().reverse();
 $('#v').innerHTML=`<div class="top"><h2>Historial</h2></div><div class="tw">${S.length?`<table><tr><th>Ticket</th><th>Fecha</th><th>Pago</th><th>Usuario</th><th class="r">Total</th><th></th></tr>
 ${S.map(s=>`<tr><td>${s.n}</td><td>${new Date(s.date).toLocaleString()}</td><td>${esc(s.pay)}${s.paid===false?' <span class="pill" style="background:var(--err);color:#fff">Fiado · Pendiente</span>':''}</td><td>${esc(s.user)}</td><td class="r">${Q(s.total)}</td><td class="r"><button class="btn s sm" onclick="ticket(sales().find(x=>x.id==='${s.id}'))">Ver ticket</button></td></tr>`).join('')}</table>`:empty('No hay ventas registradas')}</div>`}
/* ---- Administración ---- */
function administracion(){const me=cur(),U=users();
 $('#v').innerHTML=`<div class="top"><h2>Administración</h2><button class="btn" onclick="uform()">+ Nuevo usuario</button></div><div class="tw"><table><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Permisos</th><th></th></tr>
 ${U.map(u=>`<tr><td>${esc(u.user)}</td><td>${esc(u.role)}</td><td><span class="pill ${u.active?'ok':''}">${u.active?'Activo':'Inactivo'}</span></td>
 <td>${u.role==='Administrador'?'Todos':u.perms.length}</td><td class="r"><button class="btn s sm" onclick="uform('${u.id}')">Editar</button>
 <button class="btn s sm" onclick="utog('${u.id}')" ${u.id===me.id?'disabled':''}>${u.active?'Desactivar':'Activar'}</button>
 <button class="btn d sm" onclick="udel('${u.id}')" ${u.id===me.id?'disabled':''}>Eliminar</button></td></tr>`).join('')}</table></div>${me.role==='Administrador'?salesDel():''}`}
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
function salesDel(){const g={};sales().forEach(s=>{const k=dayKey(s.date);g[k]=g[k]||{n:0,t:0};g[k].n++;g[k].t+=s.total});
 const ks=Object.keys(g).sort().reverse();
 return `<div class="top" style="margin-top:24px"><h3>Borrar ventas por día</h3></div><div class="tw">${ks.length?`<table><tr><th>Día</th><th class="r">Ventas</th><th class="r">Total</th><th></th></tr>${ks.map(k=>`<tr><td>${k}</td><td class="r">${g[k].n}</td><td class="r">${Q(g[k].t)}</td><td class="r"><button class="btn d sm" onclick="sdel('${k}')">Borrar día</button></td></tr>`).join('')}</table>`:empty('No hay ventas registradas')}</div>`}
function sdel(k){const n=sales().filter(s=>dayKey(s.date)===k).length;
 modal(`<h3>Borrar ventas del ${k}</h3><p>Se borrarán ${n} venta(s) de ese día. Esta acción no se puede deshacer.</p><label class="chk"><input type="checkbox" id="rs2">Devolver las existencias al inventario</label><div class="acts"><button class="btn s" onclick="closeM()">Cancelar</button><button class="btn d" id="sdy">Borrar</button></div>`);
 $('#sdy').onclick=()=>{if(cur().role!=='Administrador')return toast('Solo el administrador puede borrar ventas',1);
  const gone=sales().filter(s=>dayKey(s.date)===k);
  if($('#rs2').checked){const add={};gone.forEach(s=>s.items.forEach(i=>add[i.id]=(add[i.id]||0)+i.qty));Data.set('products',prods().map(p=>add[p.id]?{...p,stock:p.stock+add[p.id]}:p))}
  Data.set('sales',sales().filter(s=>dayKey(s.date)!==k));closeM();toast('Ventas del día borradas');administracion()}}
function uform(id){const u=users().find(x=>x.id===id)||{user:'',role:'Usuario',perms:[]};
 modal(`<h3>${id?'Editar':'Nuevo'} usuario</h3><form id="uf"><label>Usuario *</label><input id="u1" value="${esc(u.user)}" required>
 <label>${id?'Nueva contraseña (vacío = sin cambio)':'Contraseña *'}</label><input id="u2" type="password" ${id?'':'required'} autocomplete="new-password">
 <label>Rol</label><select id="u3"><option ${u.role==='Usuario'?'selected':''}>Usuario</option><option ${u.role==='Administrador'?'selected':''}>Administrador</option></select>
 <label>Permisos (el administrador tiene todos)</label>${SECS.map(s=>`<label class="chk"><input type="checkbox" class="pc" value="${s[0]}" ${u.perms.includes(s[0])?'checked':''}>${s[1]}</label>`).join('')}
 <div class="acts"><button type="button" class="btn s" onclick="closeM()">Cancelar</button><button class="btn" type="submit">Guardar</button></div></form>`);
 $('#uf').onsubmit=e=>{e.preventDefault();const name=$('#u1').value.trim(),pw=$('#u2').value;
  if(users().some(x=>x.user.toLowerCase()===name.toLowerCase()&&x.id!==id))return toast('Ese usuario ya existe',1);
  const o={...(id?users().find(x=>x.id===id):{id:uid(),active:true}),user:name,role:$('#u3').value,perms:[...document.querySelectorAll('.pc:checked')].map(c=>c.value)};
  if(pw)o.pass=pw;
  if(id&&o.role!=='Administrador'&&!users().some(x=>x.id!==id&&x.role==='Administrador'&&x.active))return toast('Debe quedar al menos un administrador activo',1);
  Data.set('users',id?users().map(x=>x.id===id?o:x):[...users(),o]);closeM();toast('Usuario guardado');administracion()}}
function utog(id){Data.set('users',users().map(u=>u.id===id?{...u,active:!u.active}:u));toast('Estado actualizado');administracion()}
function udel(id){confirmBox('¿Eliminar este usuario?',()=>{Data.set('users',users().filter(u=>u.id!==id));toast('Usuario eliminado');administracion()})}
/* ---- Configuración ---- */
function configuracion(){const c=cfg();
 $('#v').innerHTML=`<div class="top"><h2>Configuración</h2></div><form id="cf" class="card" style="max-width:520px"><label>Nombre del negocio</label><input id="c1" value="${esc(c.name)}">
 <label>Teléfono</label><input id="c2" value="${esc(c.phone)}"><label>Dirección</label><input id="c3" value="${esc(c.addr)}">
 <label>Mensaje final del ticket</label><input id="c4" value="${esc(c.msg)}"><div class="acts"><button class="btn" type="submit">GUARDAR</button></div></form>`;
 $('#cf').onsubmit=e=>{e.preventDefault();Data.set('settings',{name:$('#c1').value.trim(),phone:$('#c2').value.trim(),addr:$('#c3').value.trim(),msg:$('#c4').value.trim()});toast('Configuración guardada');render()}}
Data.onChange(()=>{if(!$('#modal').classList.contains('on'))render()});
render();
</script>
</body>
</html>
